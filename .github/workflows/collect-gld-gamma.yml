name: Collect GLD gamma levels

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: gld-gamma-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calculate gamma levels
        working-directory: gamma-collector
        run: python collector.py --output ../gamma-data/latest.json --history ../gamma-data/history.csv
      - name: Save hourly history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamma-data/latest.json gamma-data/history.csv
          git commit -m "data: update GLD gamma levels" || exit 0
          git push

